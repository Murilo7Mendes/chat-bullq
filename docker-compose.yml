services:
  # ─── Infra ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bravy
      POSTGRES_PASSWORD: bravy123
      POSTGRES_DB: chat_bullq
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bravy -d chat_bullq"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: bravy
      MINIO_ROOT_PASSWORD: bravy123minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── API ──────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./api/.env
    environment:
      DATABASE_URL: postgresql://bravy:bravy123@postgres:5432/chat_bullq
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      # URL interna Docker — Evolution usa esse endereço para baixar mídias enviadas pelo operador
      APP_URL: http://api:3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/docs || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  # ─── Web ──────────────────────────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_HOPPE_TASK_URL: http://localhost:3001/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  # ─── Evolution API ────────────────────────────────────────────────────────
  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: chat-evolution
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: http://localhost:8080
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://bravy:bravy123@postgres:5432/chat_bullq?schema=evolution_api"
      REDIS_ENABLED: "true"
      REDIS_URI: "redis://redis:6379/2"
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: "bullq-evolution-secret"
      WEBHOOK_GLOBAL_ENABLED: "false"
      CONFIG_SESSION_PHONE_CLIENT: "BullQ"
      CONFIG_SESSION_PHONE_NAME: "Chrome"
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Redis proxy para Evolution (ela hardcoda localhost:6379) ────────────
  redis-proxy:
    image: alpine/socat:latest
    container_name: chat-redis-proxy
    network_mode: "container:chat-evolution"
    command: TCP4-LISTEN:6379,reuseaddr,fork,bind=127.0.0.1 TCP4:redis:6379
    depends_on:
      - evolution
      - redis
    restart: unless-stopped

  # ─── MCP ──────────────────────────────────────────────────────────────────
  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CHAT_BULLQ_BASE_URL: http://api:3001
      PORT: 3110
    ports:
      - "3110:3110"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
